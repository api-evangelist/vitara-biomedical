description: 'Vitara Biomedical is a medical technology company developing EXTEND, a fluid-filled
  extra-uterine environment designed to protect the fragile lungs and vital organs of extremely premature
  newborns born before 24 weeks of gestation, delaying the stress of early air exposure for up to 28 days
  while their lungs and other organs continue to develop. Surfaced as a portfolio company of GV in the
  life-sciences sector. The company is pre-market (no FDA clearance) and does not currently publish any
  public API, SDK, developer portal, or technical integration surface.'
